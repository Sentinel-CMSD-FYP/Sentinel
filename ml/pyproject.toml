[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ml"
version = "0.1.0"
description = "Sentinel perception, risk scoring and decision support"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
    "scipy>=1.11",  # reads DroneCrowd .mat annotations (sentinel_ml.localization.data)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
eval = []  # kept so "ml[dev,eval]" installs still work
# Locally install the CPU wheel first: pip install torch --index-url https://download.pytorch.org/whl/cpu
density = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
